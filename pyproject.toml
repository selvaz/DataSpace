[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataspace"
version = "0.1.0"
description = "Typed composition root for cross-repository data sources"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "selvaz" }]
keywords = ["data-sources", "composition", "health-check", "registry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# No runtime dependencies, by design: the core is two primitives over the
# standard library. Adapters live in the repositories that own the data and
# bring their own dependencies.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage   = "https://github.com/selvaz/DataSpace"
Repository = "https://github.com/selvaz/DataSpace"

[tool.hatch.build.targets.wheel]
packages = ["src/dataspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length handled by the formatter
    "RUF002",  # ambiguous unicode in docstrings (en-dash is intentional)
    "RUF003",  # ambiguous unicode in comments
    "RUF022",  # __all__ grouped by category rather than sorted
]

[tool.ruff.lint.isort]
known-first-party = ["dataspace"]

[tool.mypy]
python_version = "3.11"
# The core is small and new — strict from day one, unlike the older repos
# that type-check in tiers. Run against the package:
#     mypy src/dataspace --strict
strict = true
warn_unused_configs = true

[tool.coverage.run]
source = ["dataspace"]

[tool.coverage.report]
# A 200-line core with a fake-only suite has no excuse for gaps.
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
